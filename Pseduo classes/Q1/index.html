<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pseudo Classes Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header><h2>Pseudo-Class Examples</h2></header>

<main class="row">
  <div class="item">
    <a href="#">Hover Me</a>
    <p>:hover changes background</p>
  </div>

  <div class="item">
    <input type="text" placeholder="Focus here">
    <p>:focus changes border</p>
  </div>

  <div class="item">
    <button>Active Button</button>
    <p>:active changes color when pressed</p>
  </div>

  <ul class="item">
    <li>First</li>
    <li>Second</li>
    <li>Third</li>
    <p>:nth-child() highlights second item</p>
  </ul>
</main>

</body>
</html>
